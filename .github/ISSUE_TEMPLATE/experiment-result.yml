name: Share an HRIS experiment result
description: Report a replication, adaptation, negative result, or null result
title: "[Experiment]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing HRIS. Positive, negative, mixed, and null results are all useful. Remove private or identifying information before submitting.
  - type: input
    id: system
    attributes:
      label: AI system and model
      description: Include the interface and model/version when known.
      placeholder: Example: Chat interface, model name/version
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date of experiment
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: Tasks and shorthand cue
      description: Describe the original task, transfer task, and candidate shorthand cue.
    validations:
      required: true
  - type: textarea
    id: procedure
    attributes:
      label: Procedure
      description: Describe the history-conditioned and fresh-control conditions, number of trials, and protocol changes.
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: Overall outcome
      options:
        - Positive difference between conditions
        - No meaningful difference / null result
        - Mixed or ambiguous result
        - Negative or contrary result
    validations:
      required: true
  - type: textarea
    id: observations
    attributes:
      label: Observations and scores
      description: Include constraint recovery, task fit, stability, and unprompted reconstruction when available.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative explanations and limitations
      description: Consider wording, randomness, task familiarity, interface features, order effects, and evaluator expectations.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private, confidential, and identifying information that I do not have permission to publish.
          required: true
